<html lang="zh-CN">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;

      radial-gradient(circle at 20% 10%, rgba(180, 140, 80, 0.25), transparent 26%),

    min-height: 100vh;
    padding: 18px 14px 28px;
    overflow-x: hidden;
  }

  body::before {
    content: "";

    pointer-events: none;
    background-image:

    background-size: 160px, 220px, 130px;
    background-position: 8% 12%, 88% 42%, 50% 74%;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    padding: 18px 10px 8px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .skull-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #2c1810;
    color: #f5d76e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 0 2px #8b6f47, 0 6px 14px rgba(60, 30, 10, 0.25);
  }

  .compass-mini {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #8b6f47;
    position: relative;
    background: rgba(255, 248, 230, 0.45);
  }

  .compass-mini::before,
  .compass-mini::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1px;
    height: 10px;
    background: #5a3a18;
    transform-origin: center;
  }

  .compass-mini::before {
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .compass-mini::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }

  h1 {
    font-size: 30px;
    color: #2c1810;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow:
      0 2px 0 #f5d76e,
      0 0 0 #8b3a2a,
      0 4px 10px rgba(60, 30, 10, 0.25);
    margin-bottom: 6px;
  }

  .sub-title {
    color: #5a3a18;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 14px;
  }

  .progress {
    width: 100%;
    height: 10px;
    background: rgba(139, 111, 71, 0.28);
    border-radius: 99px;
    border: 1px solid #8b6f47;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress-fill {
    height: 100%;
    width: 4%;
    background: linear-gradient(90deg, #8b3a2a, #b8422a, #f5d76e);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  .quiz-card {
    background: linear-gradient(180deg, #fff7e1 0%, #fbe7bf 100%);
    border: 2px solid #8b6f47;
    border-radius: 22px;
    padding: 22px 18px 20px;
    box-shadow:
      inset 0 0 0 1px rgba(255, 248, 230, 0.6),
      0 18px 40px rgba(60, 30, 10, 0.22);
    position: relative;
  }

  .quiz-card::before,
  .quiz-card::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 70px;
    border: 2px dashed rgba(139, 111, 71, 0.35);
    border-radius: 50%;
  }

  .quiz-card::before {
    top: -28px;
    right: -22px;
  }

  .quiz-card::after {
    bottom: -26px;
    left: -20px;
    width: 52px;
    height: 52px;
  }

  .question-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .tag {
    background: #8b3a2a;
    color: #f5d76e;
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .page-count {
    color: #5a3a18;
    font-size: 14px;
    font-weight: 700;
  }

  .question-text {
    font-size: 20px;
    line-height: 1.5;
    color: #2c1810;
    font-weight: 800;
    margin-bottom: 18px;
    min-height: 60px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    background: #fffaf0;
    border: 2px solid #d9b382;
    border-radius: 16px;
    padding: 14px 14px 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    color: #3b2a1a;
    transition: all 0.2s ease;
    box-shadow: 0 6px 14px rgba(90, 60, 20, 0.12);
  }

  .option:hover {
    border-color: #b8422a;
    transform: translateY(-2px);
  }

  .option.selected {
    background: linear-gradient(180deg, #a53522, #7c2418);
    border-color: #f5d76e;
    color: #fff7e1;
    box-shadow: 0 10px 24px rgba(139, 58, 42, 0.35);
  }

  .num {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #8b6f47;
    color: #fff7e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
    flex-shrink: 0;
    border: 2px solid #5a3a18;
  }

  .option.selected .num {
    background: #f5d76e;
    color: #7c2418;
    border-color: #fff7e1;
  }

  .btn-row {
    display: flex;
    gap: 14px;
    margin-top: 24px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 2px solid #5a3a18;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-prev {
    background: #fbe7bf;
    color: #5a3a18;
  }

  .btn-prev:hover {
    background: #f5d76e;
  }

  .btn-next {
    background: linear-gradient(180deg, #a53522, #7c2418);
    color: #f5d76e;
    box-shadow: 0 10px 24px rgba(139, 58, 42, 0.35);
  }

  .btn-next:hover {
    transform: translateY(-2px);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  .result-card {
    background: linear-gradient(180deg, #fff7e1 0%, #fbe7bf 100%);
    border: 2px solid #8b6f47;
    border-radius: 24px;
    padding: 26px 20px 24px;
    text-align: center;
    box-shadow:
      inset 0 0 0 1px rgba(255, 248, 230, 0.6),
      0 20px 46px rgba(60, 30, 10, 0.25);
  }

  .result-title {
    font-size: 14px;
    color: #5a3a18;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .result-name {
    font-size: 32px;
    color: #7c2418;
    font-weight: 900;
    text-shadow: 0 2px 0 #f5d76e;
    margin-bottom: 16px;
  }

  .result-img {
    width: 220px;
    height: 220px;
    border-radius: 24px;
    border: 3px solid #8b6f47;
    box-shadow: 0 14px 30px rgba(60, 30, 10, 0.25);
    object-fit: cover;
    background: #fff7e1;
    margin-bottom: 18px;
  }

  .result-desc {
    background: rgba(255, 247, 225, 0.75);
    border: 1px dashed #8b6f47;
    border-radius: 18px;
    padding: 16px;
    text-align: left;
    font-size: 16px;
    line-height: 1.7;
    color: #3b2a1a;
  }

  .result-desc strong {
    color: #7c2418;
  }

  .tip {
    margin-top: 16px;
    font-size: 12px;
    color: #7a5a32;
    line-height: 1.6;
  }

  .restart {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 2px solid #5a3a18;
    background: linear-gradient(180deg, #a53522, #7c2418);
    color: #f5d76e;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
  }

  .ship-decoration {
    position: absolute;
    right: 18px;
    top: 18px;
    width: 56px;
    height: 44px;
    opacity: 0.35;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 380px) {
    h1 {
      font-size: 26px;
    }

    .question-text {
      font-size: 18px;
    }

    .option {
      font-size: 15px;
      padding: 12px 12px 12px 14px;
    }

    .result-img {
      width: 180px;
      height: 180px;
    }
  }
</style>
</head>

<script>
const questions = [

  {name:"乌索普",img:"img/wusuopu.png",desc:"胆小但善良，想象力丰富、擅长动脑找巧办法，平时爱吹牛，可伙伴遇险时，一定会鼓起勇气站出来。",A:5,B:6,C:7,D:6},
  {name:"山治",img:"img/shanzhi.png",desc:"温柔绅士，有自己的道义底线，会细心照顾身边所有人，重视浪漫与体面，护短，愿意为保护女性和同伴挺身而出。",A:6,B:4,C:8,D:4},
  {name:"乔巴",img:"img/qiaoba.png",desc:"软萌敏感，容易害羞，渴望被接纳，医术温柔，内心渴望变强，被夸奖就会偷偷开心。",A:4,B:3,C:9,D:4},
  {name:"妮可·罗宾",img:"img/luobin.png",desc:"冷静内敛，观察力超强，心思深沉，不爱主动倾诉，但极度珍视来之不易的同伴，温柔又坚韧。",A:3,B:8,C:7,D:4},
  {name:"弗兰奇",img:"img/fulanqi.png",desc:"热情外放，脑洞超大，热爱改造创造，性格大大咧咧，重承诺，是团队里可靠的技术后盾。",A:7,B:6,C:5,D:2},
  {name:"布鲁克",img:"img/buluke.png",desc:"乐观沙雕，擅长调节气氛，看淡生死，温柔体贴，会记住别人的喜好，一直带着浪漫前行。",A:6,B:4,C:8,D:2},

let currentQ = 1;
const totalQ = questions.length;
let ans = {};

const questionText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const pageCount = document.getElementById("pageCount");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progressFill = document.getElementById("progressFill");

function renderQuestion() {
  const q = questions[currentQ - 1];
  questionText.textContent = q.q;
  pageCount.textContent = `第 ${currentQ} 题 / 共 ${totalQ} 题`;
  progressFill.style.width = `${(currentQ / totalQ) * 100}%`;

  optionsBox.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    if (ans[currentQ] === q.key[i]) div.classList.add("selected");
    div.innerHTML = `<div class="num">${i + 1}</div><div>${opt}</div>`;
    div.onclick = () => {
      ans[currentQ] = q.key[i];
      renderQuestion();
    };
    optionsBox.appendChild(div);
  });

  prevBtn.disabled = currentQ === 1;
  nextBtn.textContent = currentQ === totalQ ? "提交看结果" : "下一题";
}

prevBtn.onclick = () => {
  if (currentQ > 1) {
    currentQ--;
    renderQuestion();
  }
};

nextBtn.onclick = () => {
  if (!ans[currentQ]) {
    alert("请选择一项答案！");
    return;
  }
  if (currentQ < totalQ) {
    currentQ++;
    renderQuestion();
  } else {
    calcResult();
  }
};

function calcResult() {
  const score = { A: 0, B: 0, C: 0, D: 0 };
  for (const k in ans) score[ans[k]]++;

  let best = null;
  let maxSum = -Infinity;
  charData.forEach(c => {
    const s = score.A * c.A + score.B * c.B + score.C * c.C + score.D * c.D;
    if (s > maxSum) {
      maxSum = s;
      best = c;
    }
  });

  document.getElementById("resultName").textContent = best.name;
  document.getElementById("resultDesc").innerHTML = `<strong>你像 ${best.name} 的地方：</strong><br>${best.desc}`;
  document.getElementById("resultImg").src = best.img;
  document.getElementById("resultImg").alt = best.name;

  document.getElementById("quizWrap").classList.add("hidden");
  document.getElementById("resultBox").classList.remove("hidden");
}

function restartQuiz() {
  ans = {};
  currentQ = 1;
  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("quizWrap").classList.remove("hidden");
  renderQuestion();
}
